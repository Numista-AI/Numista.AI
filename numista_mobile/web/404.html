<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Numista.AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #F4F4F2;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    }

    .owl-wrap {
      margin-bottom: 28px;
    }

    .owl-wrap img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 0 0 #1565C0);
    }

    /* Blue-outline tint — works even if image is dark */
    .owl-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #1565C0;
      background: #EFF6FF;
      overflow: hidden;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    p {
      font-size: 19px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      min-height: 56px;
    }

    .btn:hover { opacity: 0.88; }

    .btn-primary {
      background-color: #1565C0;
      color: #FFFFFF;
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #1565C0;
      border: 2px solid #1565C0;
    }

    .footer-note {
      margin-top: 32px;
      font-size: 14px;
      color: #94A3B8;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 20px; }
      h1 { font-size: 26px; }
      p { font-size: 17px; }
      .btn { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="owl-wrap">
      <div class="owl-circle">
        <img src="/icons/Icon-192.png" alt="Numista.AI owl logo" width="80" height="80">
      </div>
    </div>

    <h1>Page not found.</h1>

    <p>That address is not part of Numista.AI. The link may be old or mistyped.</p>

    <div class="btn-group">
      <a href="/" class="btn btn-primary">Home</a>
      <a href="/?route=My+Collection" class="btn btn-secondary">My Collection</a>
      <a href="/?route=Catalog" class="btn btn-secondary">Search the Catalog</a>
    </div>

    <p class="footer-note">Numista.AI &mdash; Your AI Coin Vault</p>
  </div>
</body>
</html>
