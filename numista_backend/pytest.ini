[pytest]
testpaths = . tests
pythonpath = .
norecursedirs = _scripts _archive assets receipt_labels scans sync_worker vertex_search scripts error_logs scratch
filterwarnings =
    # Suppress Python 3.14 deprecation noise from google-genai SDK internals.
    # Cannot fix upstream until google-cloud-aiplatform lifts its <2.0.0 pin.
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai
