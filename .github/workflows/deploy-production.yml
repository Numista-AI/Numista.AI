# ================================================================
# deploy-production.yml
# GitHub Actions Workflow: Auto-deploy numista.ai on every push to main
#
# HOW IT WORKS:
#   Any time code is pushed to the main branch, this workflow
#   automatically builds the Flutter web app and deploys it to
#   Firebase Hosting (numista.ai). No manual step required.
#
# ONE-TIME SETUP (do this once, then forget it):
#   1. Go to: GitHub repo -> Settings -> Secrets -> Actions
#   2. Add secret named: FIREBASE_SERVICE_ACCOUNT
#   3. Paste the contents of firebase-deploy-key.json as the value
#   4. Delete firebase-deploy-key.json from your local machine after
#
# FLUTTER VERSION:
#   Pinned to stable channel. Update channel below if needed.
# ================================================================

name: Deploy to numista.ai

on:
  push:
    branches: [main]
    # Only trigger when app code actually changes (not docs, CSVs, etc.)
    paths:
      - 'numista_mobile/**'
      - 'numista_backend/**'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  # ── JOB 1: Deploy Flutter web to Firebase Hosting ──────────────
  deploy-web:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Install app dependencies
      - name: Install Flutter dependencies
        working-directory: numista_mobile
        run: flutter pub get

      # 4. Strip the dev-only service-worker kill-switch before building.
      #    This block breaks PWA caching in production.
      #    The pattern matches the dev-only <script> block in index.html.
      - name: Remove dev service-worker kill-switch
        working-directory: numista_mobile/web
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("index.html")
          content = p.read_text(encoding="utf-8")
          # Match the dev-only block: HTML comment banner + script block
          pattern = r'<!--\s*[╔].*?STOP.*?-->\s*<script>.*?navigator\.serviceWorker.*?</script>'
          cleaned = re.sub(pattern, '', content, flags=re.DOTALL)
          if cleaned != content:
              p.write_text(cleaned, encoding="utf-8")
              print("Dev service-worker block removed.")
          else:
              print("No dev block found — proceeding with existing index.html.")
          EOF

      # 5. Build Flutter for web
      - name: Build Flutter web (release)
        working-directory: numista_mobile
        run: flutter build web --release --base-href "/"

      # 6. Authenticate to Google Cloud using the service account key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # 7. Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 8. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        working-directory: numista_mobile
        run: firebase deploy --only hosting --project studio-9101802118-8c9a8

      # 9. Print confirmation
      - name: Deployment complete
        run: |
          echo "numista.ai has been updated."
          echo "Live site: https://numista.ai"
          echo "Run ID: ${{ github.run_id }}"
