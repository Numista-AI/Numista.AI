name: Deploy to numista.ai

on:
  push:
    branches: [main]
    paths:
      - 'numista_mobile/**'
      - 'numista_backend/**'
      - '.github/workflows/**'
      - '!**.md'
      - '!**/docs/**'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  # ── JOB 1: Deploy Flutter web to Firebase Hosting ──────────────────────
  deploy-web:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: numista_mobile
        run: flutter pub get

      # Strip the dev-only service-worker kill-switch before production build
      - name: Remove dev service-worker kill-switch
        working-directory: numista_mobile/web
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("index.html")
          content = p.read_text(encoding="utf-8")
          pattern = r'<!--\s*.*?STOP.*?-->\s*<script>.*?navigator\.serviceWorker.*?</script>'
          cleaned = re.sub(pattern, '', content, flags=re.DOTALL)
          if cleaned != content:
              p.write_text(cleaned, encoding="utf-8")
              print("Dev service-worker block removed.")
          else:
              print("No dev block found - proceeding with existing index.html.")
          EOF

      - name: Build Flutter web (release)
        working-directory: numista_mobile
        run: flutter build web --release --base-href "/"

      - name: Set up Node.js (Node 18 is used to bypass Node 20/24 keep-alive connection bugs)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy to Firebase Hosting
        working-directory: numista_mobile
        run: firebase deploy --only hosting --project studio-9101802118-8c9a8

  # ── JOB 2: Deploy Firestore rules & indexes ────────────────────────────
  deploy-firestore:
    name: Deploy Firestore Rules & Indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy Firestore rules
        working-directory: numista_backend
        run: firebase deploy --only firestore:rules --project studio-9101802118-8c9a8

      # Indexes are already correctly deployed on the server. The Firebase CLI v13
      # has a reconciliation bug that produces a 409 when the local index definition
      # exactly matches what is live (it still tries to re-CREATE it). Since a 409
      # means "already exists", this is safe to treat as non-fatal.
      - name: Deploy Firestore indexes (non-fatal)
        working-directory: numista_backend
        continue-on-error: true
        run: firebase deploy --only firestore:indexes --project studio-9101802118-8c9a8 --force

  # ── JOB 3: Deploy Python backend to Cloud Run ──────────────────────────
  deploy-backend:
    name: Build & Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: studio-9101802118-8c9a8

      # Authenticate Docker to Artifact Registry (where Cloud Run images actually live)
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: numista_backend
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/studio-9101802118-8c9a8/cloud-run-source-deploy/numista-backend:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push \
            us-central1-docker.pkg.dev/studio-9101802118-8c9a8/cloud-run-source-deploy/numista-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy numista-backend \
            --image us-central1-docker.pkg.dev/studio-9101802118-8c9a8/cloud-run-source-deploy/numista-backend:latest \
            --region us-central1 \
            --project studio-9101802118-8c9a8 \
            --min-instances 1 \
            --quiet

      - name: Verify backend health
        run: |
          URL=$(gcloud run services describe numista-backend \
            --region us-central1 \
            --project studio-9101802118-8c9a8 \
            --format="value(status.url)")
          echo "Backend URL: $URL"
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
          echo "Backend health: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Backend is live and healthy"

  # ── JOB 3: Deploy scan service to Cloud Run ──────────────────────────
  deploy-scan-service:
    name: Build & Deploy Scan Service (Cloud Run)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: studio-9101802118-8c9a8

      # Authenticate Docker to Artifact Registry
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: numista_backend/scan_service
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/studio-9101802118-8c9a8/cloud-run-source-deploy/numista-scan-service:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push \
            us-central1-docker.pkg.dev/studio-9101802118-8c9a8/cloud-run-source-deploy/numista-scan-service:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy numista-scan-service \
            --image us-central1-docker.pkg.dev/studio-9101802118-8c9a8/cloud-run-source-deploy/numista-scan-service:latest \
            --region us-central1 \
            --project studio-9101802118-8c9a8 \
            --allow-unauthenticated \
            --memory 2Gi \
            --timeout 320 \
            --min-instances 1 \
            --quiet

      - name: Verify scan service health
        run: |
          URL=$(gcloud run services describe numista-scan-service \
            --region us-central1 \
            --project studio-9101802118-8c9a8 \
            --format="value(status.url)")
          echo "Scan Service URL: $URL"
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Scan service health: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Scan service health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Scan service is live and healthy"
