name: Deploy Numista.AI to Production

# Triggers on every push to main branch
# This ensures ALL changes automatically reach the live site
on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Deploy Python backend to Cloud Run
  # Runs when any file in numista_backend/ changes
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & push container image
        working-directory: numista_backend
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud builds submit . \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/numista-backend:latest \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy numista-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/numista-backend:latest \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Verify backend health
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://numista-backend-568985927038.us-central1.run.app/)
          echo "Backend health check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed (HTTP $STATUS)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Flutter frontend to Firebase Hosting
  # Runs when any file in numista_mobile/ changes
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: numista_mobile
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: numista_mobile
        run: flutter analyze

      - name: Build Flutter web (release)
        working-directory: numista_mobile
        run: flutter build web --release --base-href "/"

      - name: Deploy to Firebase Hosting
        working-directory: numista_mobile
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify live site
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://numista.ai)
          echo "Live site check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live site check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ https://numista.ai is live and responding"
